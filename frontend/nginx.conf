# nginx.conf —— 前端静态资源 + /api 反向代理到后端
# 使用 Docker 内嵌 DNS（127.0.0.11）动态解析 backend，避免 upstream 在 worker 启动时
# 缓存旧容器 IP（后端容器重建换 IP 后导致 502）。变量式 proxy_pass 每次请求都走 resolver。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Backend accepts files up to 10 MiB; allow multipart metadata overhead here.
    # The application still enforces the actual file size (not the HTTP body size).
    client_max_body_size 11m;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Background OCR upload only: 128MiB file plus multipart overhead.
    # Ordinary knowledge upload remains 10MiB; OCR inference never runs in this request.
    location = /api/knowledge/ocr/jobs/upload {
        client_max_body_size 129m;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 将 /api 反向代理到后端 FastAPI 服务（变量式，动态解析 backend 服务名）
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}